<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugada Maestra</title>
<meta name="theme-color" content="#0E1A31">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Una sola estética: vestuario nocturno (azul profundo) y cancha de madera iluminada. */
  :root {
    --ink: #0E1A31;
    --ink-2: #172A4B;
    --line: #2B4069;
    --paper: #F7EEDF;
    --muted: #A8B6CB;
    --ball: #F26B1D;
    --ball-dark: #C24E0C;
    --gold: #FFC53D;
    --bad: #F0565B;
    --good: #3CC17F;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    font-size: 15px;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  h1, h2, h3, .display { font-family: var(--display); text-wrap: balance; margin: 0; }
  p { margin: 0; line-height: 1.45; }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    line-height: 1.1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 14px;
    background: var(--ball);
    color: #fff;
    box-shadow: 0 4px 0 var(--ball-dark);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ball-dark); }
  .btn.alt { background: var(--ink-2); box-shadow: 0 4px 0 #0A1324; border: 1px solid var(--line); }
  .btn.gold { background: var(--gold); color: #3A2600; box-shadow: 0 4px 0 #B9860F; }
  .btn.small { font-size: 16px; min-height: 44px; padding: 6px 14px; border-radius: 11px; gap: 6px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* Iconos: un solo juego de SVG en línea (game.js → ICONS), trazo de 2 sobre una grilla de 24 */
  .ic {
    width: 1.25em; height: 1.25em; flex: none; display: inline-block; vertical-align: -0.24em;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .ic .f { fill: currentColor; }
  .ic .d { stroke: rgba(70, 40, 0, .6); }
  .ic-heart { color: var(--bad); }
  .ic-coin, .ic-star { color: var(--gold); }
  .ic-star.off, .ic-heart.off { color: #3A4C70; }

  /* Escudo de club o de selección (SVG de game.js → crest) */
  .crest { width: 40px; height: 46px; flex: none; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .crest.sm { width: 22px; height: 25px; }
  .crest.lg { width: 54px; height: 62px; }
  .flag { font-size: 20px; line-height: 1; }

  /* Barra superior */
  .hud { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
    background: rgba(23,42,75,.88); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 13px 4px 9px;
    font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill .ic { width: 20px; height: 20px; }
  .pill small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); }
  .hud .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 13px; flex: none;
    background: rgba(23,42,75,.88); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 18px; color: var(--paper);
    transition: transform .08s ease, background-color .15s ease;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn .ic { width: 22px; height: 22px; }
  .icon-btn.gold { color: var(--gold); }
  .snd-btn[aria-pressed="false"] { color: var(--muted); }
  .scr-title { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }

  /* Portada: la escena 3D ocupa toda la pantalla; el título y los botones van encima, sobre dos
     degradados que aseguran la lectura. */
  #scr-home { position: fixed; inset: 0; z-index: 1; display: block; padding: 0; background: #06080f; }
  .hero-court { position: absolute; inset: 0; overflow: hidden; background: #06080f; }
  /* Un solo canvas 3D para todo el juego: llena el contenedor donde esté (portada o partida) */
  #court { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; border-radius: inherit; }
  .home-top, .home-bottom { position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none; }
  .home-top > .wrap > *, .home-bottom > .wrap > * { pointer-events: auto; }
  .wrap { width: 100%; max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; }
  .home-top {
    top: 0;
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to bottom, rgba(6,8,15,.94) 0%, rgba(6,8,15,.78) 50%, rgba(6,8,15,.34) 82%, rgba(6,8,15,0) 100%);
  }
  .home-top .wrap { gap: clamp(10px, 2.6vh, 22px); }
  .home-bottom {
    bottom: 0;
    padding: 64px max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(6,8,15,.96) 0%, rgba(6,8,15,.86) 58%, rgba(6,8,15,.4) 84%, rgba(6,8,15,0) 100%);
  }
  .home-bottom .wrap { gap: 10px; }
  .brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; pointer-events: none !important; }
  .brand .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--display); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .brand .kicker::before, .brand .kicker::after { content: ''; width: 22px; height: 2px; border-radius: 1px; background: currentColor; opacity: .7; }
  .brand h1 {
    font-size: clamp(54px, 18.5vw, 84px); line-height: .82; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em;
    color: #fff; transform: rotate(-3deg); transform-origin: 50% 60%;
    text-shadow: 0 3px 0 rgba(4,8,18,.55), 0 10px 26px rgba(0,0,0,.65);
  }
  .brand h1 span { display: block; color: var(--ball); text-shadow: 0 3px 0 #7A2E05, 0 10px 26px rgba(0,0,0,.65); }
  .team-card {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: rgba(18,32,60,.9); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px 8px 8px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4); transition: transform .08s ease;
  }
  .team-card:empty { display: none; }
  .team-card:active { transform: scale(.985); }
  .team-card .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .team-card .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .team-card .label span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-card .name { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-card .name small { color: var(--muted); font-size: 18px; font-weight: 600; }
  .ovr { flex: none; display: flex; flex-direction: column; align-items: center; line-height: 1; padding-inline: 4px; }
  .ovr b { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .ovr span { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 2px; }
  .btn.play {
    flex-direction: column; gap: 1px; width: 100%; min-height: 68px; padding: 10px 20px; border-radius: 18px;
    font-size: 30px; line-height: 1; letter-spacing: .05em;
    background: linear-gradient(to bottom, #FF8433, var(--ball)); box-shadow: 0 5px 0 var(--ball-dark), 0 12px 26px rgba(242,107,29,.35);
  }
  .btn.play:active { box-shadow: 0 2px 0 var(--ball-dark); }
  .btn.play small { font-family: var(--body); font-weight: 600; font-size: 13px; letter-spacing: 0; text-transform: none; opacity: .92; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .home-actions .btn { font-size: 18px; padding-inline: 8px; background: rgba(23,42,75,.92); }

  /* Recorrido de temporada: un tramo por temporada, un nodo por nivel, unidos por un camino */
  #scr-levels { padding-bottom: 0; gap: 10px; }
  .scroll {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    display: flex; flex-direction: column; scrollbar-width: none;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  }
  .scroll::-webkit-scrollbar { display: none; }
  .season-head {
    position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: var(--ink-2);
    background: linear-gradient(105deg, color-mix(in srgb, var(--c1) 62%, #0B1426) 0%, color-mix(in srgb, var(--c1) 22%, #111F3B) 46%, #14233F 100%);
    box-shadow: 0 8px 18px rgba(6,10,20,.55);
  }
  .season-head::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c2);
  }
  .season-head .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .season-head .label { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.78); }
  .season-head h3 { font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .season-head .sub { font-size: 12.5px; color: rgba(255,255,255,.74); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .season-head .pill { background: rgba(6,10,20,.5); border-color: rgba(255,255,255,.16); font-size: 16px; min-height: 32px; }
  .season-head.closed { --c1: #33466B; --c2: #4A5F8C; }
  .path { position: relative; padding: 6px 0 14px; }
  .trail { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .trail path { fill: none; stroke-linecap: round; }
  .trail .base { stroke: #2B4069; stroke-width: 6; stroke-dasharray: 1 13; }
  .trail .done { stroke: var(--gold); stroke-width: 5; opacity: .9; }
  .lvl {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; width: 100%; height: 92px;
    background: none; text-align: left; padding: 0 4% 0 8%;
  }
  .lvl.right { flex-direction: row-reverse; text-align: right; padding: 0 8% 0 4%; }
  .node {
    position: relative; flex: none; width: 66px; height: 66px; border-radius: 50%;
    display: grid; place-items: center; box-sizing: border-box;
    background: var(--ink-2); border: 3px solid #3A4C70; box-shadow: 0 5px 0 #0A1324, 0 10px 18px rgba(0,0,0,.35);
    transition: transform .1s ease;
  }
  .lvl:active .node { transform: translateY(3px) scale(.96); }
  .node .num { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; }
  .node .ic { width: 26px; height: 26px; color: #6F82A8; }
  .lvl.done .node { border-color: var(--gold); background: #1B3158; }
  .lvl.current .node {
    background: linear-gradient(to bottom, #FF8433, var(--ball)); border-color: #FFE3C2; color: #fff;
    box-shadow: 0 5px 0 var(--ball-dark), 0 0 22px rgba(242,107,29,.6);
  }
  .lvl.current .node::after {
    content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--ball);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.86); opacity: .95; } to { transform: scale(1.32); opacity: 0; } }
  /* Partido de selección: nodo más grande con el aro de los colores del país */
  .lvl.nat .node {
    width: 74px; height: 74px; border: 5px solid transparent;
    background: linear-gradient(#1B3158, #1B3158) padding-box, linear-gradient(135deg, var(--n1) 50%, var(--n2) 50%) border-box;
  }
  .lvl.nat.current .node { background: linear-gradient(to bottom, #FF8433, var(--ball)) padding-box, linear-gradient(135deg, var(--n1) 50%, var(--n2) 50%) border-box; }
  .lvl.locked .node { background: #121F3A; border-color: #24365C; box-shadow: 0 4px 0 #0A1324; }
  .lvl.locked.nat .node { background: linear-gradient(#121F3A, #121F3A) padding-box, linear-gradient(135deg, var(--n1) 50%, var(--n2) 50%) border-box; opacity: .7; }
  .lvl .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .lvl.right .info { align-items: flex-end; }
  .lvl .name { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.02; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
  .lvl .st { display: flex; gap: 2px; }
  .lvl .st .ic { width: 17px; height: 17px; }
  .lvl .tag {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--display); font-weight: 700; font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; line-height: 1; padding: 3px 7px; border-radius: 6px;
    background: var(--gold); color: #3A2600;
  }
  .lvl .tag .flag { font-size: 13px; }
  .lvl .tag.go { background: var(--ball); color: #fff; }
  .lvl.locked .info { opacity: .5; }
  .lvl.locked .tag { background: #33466B; color: var(--paper); }
  .lvl.shake .node { animation: shake .32s ease both; }
  @keyframes shake { 20% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
  .path-end { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 16px 0; }

  /* Partida: pantalla completa. El 3D ocupa todo el teléfono de borde a borde (también bajo el
     margen lateral del body) y la interfaz va superpuesta en dos franjas translúcidas. */
  #scr-game { position: fixed; inset: 0; z-index: 5; display: block; padding: 0; gap: 0; background: #06080f; }
  .stage { position: absolute; inset: 0; touch-action: none; overflow: hidden; background: #06080f; }
  .gbar { position: absolute; left: 0; right: 0; z-index: 2; display: flex; pointer-events: none; }
  .gbar button { pointer-events: auto; }
  .gbar.top {
    top: 0; align-items: center; gap: 6px;
    padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to bottom, rgba(6,8,15,.86) 0%, rgba(6,8,15,.5) 60%, rgba(6,8,15,0) 100%);
  }
  .gbar.bottom {
    bottom: 0; flex-direction: column; gap: 6px;
    padding: 18px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  /* El fondo va en un seudoelemento para poder aclararlo: mientras se traza una conducción que
     termina debajo de la barra, la barra se vuelve casi transparente y deja ver el destino. */
  .gbar.bottom::before {
    content: ''; position: absolute; inset: 0; z-index: -1; transition: opacity .15s ease;
    background: linear-gradient(to top, rgba(6,8,15,.9) 0%, rgba(6,8,15,.62) 65%, rgba(6,8,15,0) 100%);
  }
  .gbar.bottom > * { transition: opacity .15s ease; }
  .gbar.bottom.see-through::before { opacity: .18; }
  .gbar.bottom.see-through > .movebar, .gbar.bottom.see-through > .controls { opacity: .25; }
  .gbar .icon-btn { width: 44px; height: 44px; border-radius: 13px; background: rgba(23,42,75,.78); border-color: rgba(255,255,255,.14); }
  .gbar .pill { padding: 4px 10px 4px 7px; font-size: 16px; min-height: 32px; gap: 4px; background: rgba(23,42,75,.78); border-color: rgba(255,255,255,.14); }
  .lvl-label { font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; flex: 1; min-width: 0; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvl-label small { display: block; font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movebar {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font-family: var(--display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .03em;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .movebar b { font-size: 24px; font-weight: 800; color: var(--paper); }
  .movebar .goal { color: var(--muted); font-size: 15px; white-space: nowrap; }
  /* Ayuda de una o dos líneas, centrada en una caja de alto fijo (la barra no cambia de tamaño y
     el encuadre de la cámara no salta). El texto va en un span que corta con puntos suspensivos. */
  .tipbar {
    --tip-lines: 2;
    font-size: 13px; line-height: 1.3; height: calc(var(--tip-lines) * 1.3em); color: #DCE4F0; text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); padding-inline: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .tipbar > span {
    display: -webkit-box; -webkit-line-clamp: var(--tip-lines); -webkit-box-orient: vertical; overflow: hidden;
    max-height: calc(var(--tip-lines) * 1.3em);
  }
  /* En teléfonos angostos entran menos letras por línea: la ayuda tiene una línea más */
  @media (max-width: 374px) { .tipbar { --tip-lines: 3; } }
  .gbar .controls { display: flex; align-items: center; gap: 8px; }
  .gbar .controls .spacer { flex: 1; }
  .gbar .btn.small { font-size: 15px; min-height: 44px; padding: 4px 15px; border-radius: 999px; box-shadow: 0 3px 0 #0A1324; }
  .gbar .btn.gold.small { box-shadow: 0 3px 0 #B9860F; }
  .gbar .btn.alt.small { background: rgba(23,42,75,.85); }
  .icon-btn.round { width: 44px; height: 44px; border-radius: 50%; color: var(--paper); transition: opacity .2s ease; }
  .icon-btn.round svg { width: 22px; height: 22px; display: block; }
  .icon-btn.round.off { opacity: .45; }
  /* Cartel del poseedor: va al costado o debajo del jugador (game.js elige dónde no tapa a nadie)
     y se apaga mientras se arrastra, para no tapar la línea que se está trazando. */
  .nametag {
    position: absolute; left: 0; top: 0;
    background: rgba(14,26,49,.88); color: var(--paper); border: 1px solid rgba(255,255,255,.12);
    font-weight: 700; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px;
    white-space: nowrap; pointer-events: none; transition: opacity .12s ease;
  }
  .nametag.dim { opacity: 0; }
  .howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.35; }
  .howto b { color: var(--gold); font-weight: 600; }
  /* Medidor de fuerza: game.js lo centra en la zona libre entre las dos barras (top en px) y elige
     el lado donde no tapa al tirador. La animación de entrada solo cambia la opacidad: una que toque
     transform pisaría la posición. */
  .meter {
    position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 0;
    width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 0 6px; border-radius: 16px; background: rgba(6,8,15,.5);
    pointer-events: none; animation: appear .2s ease both;
  }
  .meter.left { right: auto; left: max(8px, env(safe-area-inset-left, 0px)); }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  .meter-cancel {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; margin-top: 4px;
