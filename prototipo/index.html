<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugada Maestra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Una sola estética: vestuario nocturno (azul profundo) y cancha de madera iluminada. */
  :root {
    --ink: #0E1A31;
    --ink-2: #172A4B;
    --line: #2B4069;
    --paper: #F7EEDF;
    --muted: #A8B6CB;
    --ball: #F26B1D;
    --ball-dark: #C24E0C;
    --gold: #FFC53D;
    --bad: #F0565B;
    --good: #3CC17F;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    font-size: 15px;
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-block: 12px; }
  h1, h2, h3, .display { font-family: var(--display); text-wrap: balance; margin: 0; }
  p { margin: 0; line-height: 1.45; }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn {
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 13px 20px;
    border-radius: 14px;
    background: var(--ball);
    color: #fff;
    box-shadow: 0 4px 0 var(--ball-dark);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ball-dark); }
  .btn.alt { background: var(--ink-2); box-shadow: 0 4px 0 #0A1324; border: 1px solid var(--line); }
  .btn.gold { background: var(--gold); color: #3A2600; box-shadow: 0 4px 0 #B9860F; }
  .btn.small { font-size: 16px; padding: 9px 14px; border-radius: 11px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* Barra superior */
  .hud { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px;
    font-family: var(--display); font-weight: 700; font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  .pill small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); }
  .heart { color: var(--bad); }
  .coin {
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFE28A, var(--gold) 55%, #C48B0B);
    display: inline-block;
  }
  .hud .spacer { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--ink-2); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 18px;
  }

  /* Inicio */
  .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding-top: 8px; }
  .brand .kicker { font-family: var(--display); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ball); font-size: 14px; }
  .brand h1 { font-size: clamp(44px, 12vw, 60px); line-height: .86; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; }
  .brand h1 span { color: var(--ball); }
  #scr-home { justify-content: center; }
  .hero-court { flex: 1; min-height: 170px; max-height: 52vh; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid var(--line); background: #06080f; }
  /* Un solo canvas 3D para todo el juego: llena el contenedor donde esté (portada o partida) */
  #court { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; border-radius: inherit; }
  .team-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  }
  .team-card .meta { flex: 1; min-width: 0; }
  .team-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .team-card .name { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; }
  .crest {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .crest.sm { width: 22px; height: 22px; border-width: 1.5px; }
  .home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .home-actions .btn:first-child { grid-column: 1 / -1; font-size: 26px; padding: 16px; }

  /* Lista de niveles */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 8px; }
  .season h3 { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }
  .season p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .lvl {
    aspect-ratio: 1; max-width: 100%;
    border-radius: 16px; background: var(--ink-2); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    position: relative;
  }
  .lvl .num { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
  .lvl .st { font-size: 13px; letter-spacing: 2px; color: var(--gold); }
  .lvl .st .off { color: #3A4C70; }
  .lvl.locked { opacity: .45; }
  .lvl.current { border-color: var(--ball); box-shadow: inset 0 0 0 2px var(--ball); }
  .lvl.nat::after {
    content: 'Selección'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #3A2600; font-family: var(--display); font-weight: 700;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px;
  }

  /* Partida: pantalla completa. El 3D ocupa todo el teléfono de borde a borde (también bajo el
     margen lateral del body) y la interfaz va superpuesta en dos franjas translúcidas. */
  #scr-game { position: fixed; inset: 0; z-index: 5; display: block; padding: 0; gap: 0; background: #06080f; }
  .stage { position: absolute; inset: 0; touch-action: none; overflow: hidden; background: #06080f; }
  .gbar { position: absolute; left: 0; right: 0; z-index: 2; display: flex; pointer-events: none; }
  .gbar button { pointer-events: auto; }
  .gbar.top {
    top: 0; align-items: center; gap: 8px;
    padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to bottom, rgba(6,8,15,.86) 0%, rgba(6,8,15,.5) 60%, rgba(6,8,15,0) 100%);
  }
  .gbar.bottom {
    bottom: 0; flex-direction: column; gap: 6px;
    padding: 22px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  /* El fondo va en un seudoelemento para poder aclararlo: mientras se traza una conducción que
     termina debajo de la barra, la barra se vuelve casi transparente y deja ver el destino. */
  .gbar.bottom::before {
    content: ''; position: absolute; inset: 0; z-index: -1; transition: opacity .15s ease;
    background: linear-gradient(to top, rgba(6,8,15,.9) 0%, rgba(6,8,15,.62) 65%, rgba(6,8,15,0) 100%);
  }
  .gbar.bottom > * { transition: opacity .15s ease; }
  .gbar.bottom.see-through::before { opacity: .18; }
  .gbar.bottom.see-through > .movebar, .gbar.bottom.see-through > .controls { opacity: .25; }
  .gbar .icon-btn { width: 36px; height: 36px; border-radius: 11px; font-size: 17px; background: rgba(23,42,75,.78); border-color: rgba(255,255,255,.14); }
  .gbar .pill { padding: 4px 10px; font-size: 15px; background: rgba(23,42,75,.78); border-color: rgba(255,255,255,.14); }
  .lvl-label { font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; min-width: 0; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .lvl-label small { display: block; font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movebar {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font-family: var(--display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .03em;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .movebar b { font-size: 24px; font-weight: 800; color: var(--paper); }
  .movebar .goal { color: var(--muted); font-size: 15px; white-space: nowrap; }
  /* Ayuda de una o dos líneas, centrada en una caja de alto fijo (la barra no cambia de tamaño y
     el encuadre de la cámara no salta). El texto va en un span que corta con puntos suspensivos. */
  .tipbar {
    --tip-lines: 2;
    font-size: 13px; line-height: 1.3; height: calc(var(--tip-lines) * 1.3em); color: #DCE4F0; text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,.8); padding-inline: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .tipbar > span {
    display: -webkit-box; -webkit-line-clamp: var(--tip-lines); -webkit-box-orient: vertical; overflow: hidden;
    max-height: calc(var(--tip-lines) * 1.3em);
  }
  /* En teléfonos angostos entran menos letras por línea: la ayuda tiene una línea más */
  @media (max-width: 374px) { .tipbar { --tip-lines: 3; } }
  .gbar .controls { display: flex; align-items: center; gap: 8px; }
  .gbar .controls .spacer { flex: 1; }
  .gbar .btn.small { font-size: 15px; padding: 8px 15px; border-radius: 999px; box-shadow: 0 3px 0 #0A1324; }
  .gbar .btn.gold.small { box-shadow: 0 3px 0 #B9860F; }
  .gbar .btn.alt.small { background: rgba(23,42,75,.85); }
  .icon-btn.round { width: 40px; height: 40px; border-radius: 50%; color: var(--paper); transition: opacity .2s ease; }
  .icon-btn.round svg { width: 22px; height: 22px; display: block; }
  .icon-btn.round.off { opacity: .45; }
  /* Cartel del poseedor: va al costado o debajo del jugador (game.js elige dónde no tapa a nadie)
     y se apaga mientras se arrastra, para no tapar la línea que se está trazando. */
  .nametag {
    position: absolute; left: 0; top: 0;
    background: rgba(14,26,49,.88); color: var(--paper); border: 1px solid rgba(255,255,255,.12);
    font-weight: 700; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px;
    white-space: nowrap; pointer-events: none; transition: opacity .12s ease;
  }
  .nametag.dim { opacity: 0; }
  .howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.35; }
  .howto b { color: var(--gold); font-weight: 600; }
  /* Medidor de fuerza: game.js lo centra en la zona libre entre las dos barras (top en px) y elige
     el lado donde no tapa al tirador. La animación de entrada solo cambia la opacidad: una que toque
     transform pisaría la posición. */
  .meter {
    position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 0;
    width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 0 6px; border-radius: 16px; background: rgba(6,8,15,.5);
    pointer-events: none; animation: appear .2s ease both;
  }
  .meter.left { right: auto; left: max(8px, env(safe-area-inset-left, 0px)); }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  .meter-cancel {
    pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; margin-top: 4px;
    background: rgba(14,26,49,.9); border: 1.5px solid rgba(255,255,255,.75); color: #fff;
    font-size: 17px; font-weight: 700; line-height: 1; display: grid; place-items: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.45);
  }
  .meter-cancel:active { transform: scale(.92); }
  .meter-label, .meter-dist {
    font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); text-align: center; white-space: nowrap;
  }
  .meter-dist { font-size: 11px; color: var(--gold); }
  .meter-track {
    position: relative; width: 22px; height: 200px;
    border-radius: 11px; border: 2px solid rgba(255,255,255,.85);
    background: linear-gradient(to top, #3CC17F 0%, #FFC53D 55%, #F0565B 100%);
    box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25);
    overflow: hidden;
  }
  .meter-track::before { content: ''; position: absolute; inset: 0; background: rgba(14,26,49,.55); }
  .meter-zone { position: absolute; left: 0; right: 0; background: rgba(60,193,127,.95); box-shadow: 0 0 0 1px rgba(255,255,255,.7) inset; }
  .meter-mark {
    position: absolute; left: -2px; right: -2px; height: 5px; margin-top: -2.5px;
    background: #fff; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,.6);
  }
  /* Mira sobre el aro: el anillo mide el margen real de puntería; el punto, por dónde pasa la línea */
  .aim-ring {
    position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%; box-sizing: border-box;
    border: 2.5px solid var(--aim, #FFB02E); box-shadow: 0 0 0 1.5px rgba(6,8,15,.55), inset 0 0 0 1.5px rgba(6,8,15,.45);
    transition: border-color .1s ease;
  }
  .aim-ring::before, .aim-ring::after { content: ''; position: absolute; border-radius: 1px; }
  .aim-ring::before { left: 50%; top: -7px; bottom: -7px; width: 2px; margin-left: -1px; background: linear-gradient(var(--aim, #FFB02E) 0 7px, transparent 7px calc(100% - 7px), var(--aim, #FFB02E) calc(100% - 7px)); }
  .aim-ring::after { top: 50%; left: -7px; right: -7px; height: 2px; margin-top: -1px; background: linear-gradient(90deg, var(--aim, #FFB02E) 0 7px, transparent 7px calc(100% - 7px), var(--aim, #FFB02E) calc(100% - 7px)); }
  .aim-ring.in { animation: snap .22s cubic-bezier(.2,1.7,.4,1) both; border-width: 3.5px; box-shadow: 0 0 0 1.5px rgba(6,8,15,.55), 0 0 14px 2px rgba(75,227,143,.75); }
  @keyframes snap { from { scale: 1.45; } to { scale: 1; } }
  .aim-dot {
    position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #fff; border: 2px solid var(--aim, #FFB02E); box-shadow: 0 0 0 1px rgba(6,8,15,.6); pointer-events: none; box-sizing: border-box;
  }
  /* Lupa: repite la zona del aro por encima del dedo, que la tapa */
  .aim-lens { position: absolute; left: 0; top: 0; width: 84px; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .aim-lens canvas {
    width: 84px; height: 84px; border-radius: 50%; display: block; background: #06080f;
    border: 3px solid var(--aim, #FFB02E); box-shadow: 0 6px 18px rgba(0,0,0,.55), 0 0 0 1.5px rgba(6,8,15,.6); box-sizing: border-box;
  }
  .aim-lens span {
    font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;
    color: #0B1220; background: var(--aim, #FFB02E); padding: 2px 8px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  /* Destino de la conducción: va por encima de las barras para que nunca quede tapado */
  .drib-pin { position: absolute; left: 0; top: 0; z-index: 3; width: 0; height: 0; pointer-events: none; }
  .drib-pin::before {
    content: ''; position: absolute; left: -13px; top: -40px; width: 26px; height: 26px; box-sizing: border-box;
    border-radius: 50% 50% 50% 0; rotate: -45deg; background: #2EE6A0; border: 2.5px solid #06281C;
    box-shadow: 0 3px 8px rgba(0,0,0,.5); animation: pin-bob .7s ease-in-out infinite alternate;
  }
  .drib-pin::after {
    content: ''; position: absolute; left: -4px; top: -31px; width: 8px; height: 8px; border-radius: 50%; background: #06281C;
    animation: pin-bob .7s ease-in-out infinite alternate;
  }
  @keyframes pin-bob { from { translate: 0 0; } to { translate: 0 -4px; } }
  /* Tutorial: mano fantasma que repite el gesto y cartel de consejo */
  .tut { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tut-trail {
    position: absolute; left: 0; top: 0; height: 5px; margin-top: -2.5px; transform-origin: 0 50%; border-radius: 3px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.95) 0 9px, transparent 9px 16px);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.7));
  }
  .tut-ring {
    position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; box-sizing: border-box;
    border: 3px solid #fff; background: rgba(255,255,255,.22); box-shadow: 0 0 0 1.5px rgba(6,8,15,.45);
  }
  .tut-hand { position: absolute; left: 0; top: 0; width: 46px; height: 58px; margin: -3px 0 0 -21px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
  .tut-hand svg { width: 100%; height: 100%; display: block; }
  .coach {
    position: absolute; left: 12px; right: 12px; top: 0; width: fit-content; margin-inline: auto;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    background: rgba(14,26,49,.92); border: 1px solid rgba(255,197,61,.7); color: var(--paper);
    font-weight: 600; font-size: 13.5px; line-height: 1.2; padding: 8px 14px; border-radius: 16px; text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.45); animation: appear .25s ease both;
  }
  .coach .swipe { flex: none; width: 34px; height: 16px; position: relative; }
  .coach .swipe::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: rgba(255,255,255,.35); border-radius: 1px; }
  .coach .swipe::after { content: ''; position: absolute; left: 0; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); animation: swipe 1.5s ease-in-out infinite alternate; }
  @keyframes swipe { from { translate: 0 0; } to { translate: 22px 0; } }
  .float-msg {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font-family: var(--display); font-weight: 800; font-size: 54px; text-transform: uppercase;
    color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 24px rgba(0,0,0,.4);
    pointer-events: none; white-space: nowrap;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1) both;
  }
  .float-msg.good { color: var(--gold); }
  .float-msg.bad { color: #fff; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

  /* Ventanas */
  #modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(5, 10, 22, .72);
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet {
    width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 22px;
    padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    animation: rise .25s ease both;
  }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { font-size: 34px; font-weight: 800; text-transform: uppercase; line-height: .95; }
  .sheet .eyebrow { font-family: var(--display); font-weight: 700; color: var(--ball); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; }
  .sheet .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .sheet .note { font-size: 12px; color: var(--muted); }
  .big-stars { display: flex; justify-content: center; gap: 10px; font-size: 52px; line-height: 1; }
  .big-stars span { color: #33466B; }
  .big-stars span.on { color: var(--gold); animation: pop-star .45s cubic-bezier(.2,1.6,.4,1) both; }
  .big-stars span:nth-child(2).on { animation-delay: .15s; }
  .big-stars span:nth-child(3).on { animation-delay: .3s; }
